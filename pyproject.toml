[project]
name = "scanitd"
version = "0.9.1"
description = "ScanITD"
authors = [
    { name = "Ting-You Wang", email = "tywang@northwestern.edu" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "pysam>=0.22.0,<1.0.0",
    "pyfaidx>=0.7.2,<1.0.0",
    "psutil>=5.9.5,<6.0.0",
    "ssw-py>=1.0.1,<2.0.0",
    "loguru>=0.7.0,<1.0.0",
    "typer>=0.12.5,<1.0.0",
    "rich>=13.7.0,<14.0.0",
]

[project.urls]
Homepage = "https://github.com/ylab-hi/ScanITD"
Repository = "https://github.com/ylab-hi/ScanITD"
Documentation = "https://scanitd.readthedocs.io"
Changelog = "https://github.com/ylab-hi/ScanITD/releases"

[project.scripts]
scanitd = "scanitd.cli.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.1.6,<1.0.0",
    "codespell>=2.2.2,<3.0.0",
    "ipdb>=0.13.11,<1.0.0",
    "isort>=5.12.0,<6.0.0",
    "pytest>=7.4.3,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "coverage[toml]>=7.3,<8.0",
    "safety>=2.1.1,<3.0.0",
    "mypy>=1.7,<2.0",
    "typeguard>=4.1.5,<5.0.0",
    "xdoctest[colors]>=1.1.2,<2.0.0",
    "sphinx>=7.2.6,<8.0.0",
    "myst-parser==3.0.0",
    "sphinx-autobuild>=2021.3.14",
    "pre-commit>=3.3.3,<4.0.0",
    "flake8>=6.1.0,<7.0.0",
    "black>=23.3,<25.0",
    "bandit>=1.7.3,<2.0.0",
    "flake8-bandit>=4.1",
    "flake8-bugbear>=23.9.16,<25.0.0",
    "flake8-docstrings>=1.6.0,<2.0.0",
    "flake8-rst-docstrings>=0.3.0,<1.0.0",
    "pep8-naming>=0.13.2,<1.0.0",
    "reorder-python-imports>=3.8.2,<4.0.0",
    "pre-commit-hooks>=4.3.0,<5.0.0",
    "sphinx-rtd-theme>=1.3.0,<2.0.0",
    "sphinx-click>=5.0.1,<6.0.0",
    "Pygments>=2.17.1,<3.0.0",
    "pytest-mock>=3.11.1,<4.0.0",
    "nox>=2023.4.22",
    "flake8-broken-line>=1.0.0,<2.0.0",
    "flake8-comprehensions>=3.13.0,<4.0.0",
    "flake8-eradicate>=1.5.0,<2.0.0",
    "flake8-simplify>=0.21.0,<1.0.0",
    "pynvim>=0.4.3,<1.0.0",
    "flake8-2020>=1.8.1,<2.0.0",
    "flake8-alfred>=1.1.1,<2.0.0",
    "cohesion>=1.0.0,<2.0.0",
]


[tool.mypy]
strict = false
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
exclude = "cppext"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
norecursedirs = ["cppext", ".git", ".tox", "docs"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=scanitd",
    "--cov-report=term-missing",
    "--cov-branch",
    "--cov-fail-under=35",
]
markers = [
    "integration: integration tests with mocked or real IO paths",
    "slow: tests that take longer than a typical unit test",
]

[tool.bandit]
exclude_dirs = ['tests']
skips = ["B602", "B404", "B603"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 200
exclude = ["tests"]
target-version = "py310"
select = [
    # "ANN",
    # "D",
    "A",
    "F",
    "E",
    "W",
    "C90",
    "I",
    "UP",
    "N",
    "YTT",
    "TID",
    "S",
    "BLE",
    "FBT",
    "PLR",
    "B",
    "B9",
    "A",
    "C4",
    "T10",
    "EM",
    "ICN",
    "T20",
    "Q",
    "RET",
    "SIM",
    "ARG",
    "DTZ",
    "ERA",
    "PD",
    "PGH",
    "PLC",
    "PLE",
    "PLW",
    "RUF",
    "PL",
    "TD",
    "FIX",
    "PTH",
    "SLOT",
    "PT",
    "PYI",
    "PIE",
    "ISC",
    "FA",
    "EXE",
    # "CPY",
    "COM",
]
ignore = [
    "ANN001",
    "D203",
    "D213",
    "PGH003",
    "PLR0911", # Too many return statements
    "PLR0913", # Too many arguments to function call
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "DTZ005",  # Without `tz` argument
    "C901",    # Too complex
    'PLC0415',
    'PLR1702',
    'PLR0917',
    # formater conflict
    'COM812',
    'COM819',
    'D206',
    'ISC001',
    'Q000',
    'Q001',
    'Q002',
    'Q003',
    'W191',
    "PLR0904",
]


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
# magic-trailing-comma = "respect"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "pep621"
major_version_zero = true

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"
