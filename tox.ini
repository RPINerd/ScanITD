[tox]
envlist = py310, py311, py312, py313, py314, lint

[travis]
python =
    3.14: py314
    3.13: py313
    3.12: py312
    3.11: py311
    3.10: py310

[testenv:lint]
basepython = python
deps = ruff
commands = ruff check src tests

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
    pytest
    pytest-cov
commands = pytest
